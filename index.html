<!doctype html>
<html lang="fr">
<head>

  <title>Mon doux planning</title>
  <style>
    :root{--ink:#513945;--muted:#8e7480;--rose:#d96b9a;--rose2:#f5bfd1;--paper:#fff9fb;--line:#f2dce5;--shadow:0 15px 42px #a64c7530}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#fff7fa}body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 8%,#ffe9f0 0 10%,transparent 31%),radial-gradient(circle at 94% 0,#eadcff 0 8%,transparent 25%),linear-gradient(145deg,#fff7fa,#fdfaff 55%,#fff2f7);overscroll-behavior-y:none}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;touch-action:manipulation}.shell{width:min(960px,calc(100% - 28px));margin:auto;padding:calc(30px + env(safe-area-inset-top)) 0 calc(48px + env(safe-area-inset-bottom))}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}.eyebrow{margin:0 0 4px;color:var(--rose);font-size:.78rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.75rem,5vw,2.7rem);letter-spacing:-.055em}.hero p{margin:7px 0 0;color:var(--muted)}.date-chip,.glass,.card,dialog{background:#ffffffb8;border:1px solid #ffffffcc;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.date-chip{padding:12px 15px;border-radius:18px;text-align:center;color:var(--rose);font-weight:750;font-size:.84rem}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.tabs{display:flex;gap:7px;overflow:auto;padding:4px;flex:1;min-width:230px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}.tab,.outline,.primary,.icon-btn{border-radius:13px;padding:10px 14px;transition:.2s ease;font-weight:700}.tab{background:#ffffffa8;color:var(--muted);white-space:nowrap;scroll-snap-align:start}.tab.active,.primary{color:white;background:linear-gradient(125deg,#df769f,#bd80c8);box-shadow:0 7px 16px #cd6c9638}.outline{background:#fff;color:var(--rose);border:1px solid #f2c9d9}.outline:hover,.tab:hover{transform:translateY(-2px)}.primary:hover{filter:brightness(1.05);transform:translateY(-2px)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}.summary>div{padding:14px 16px;border-radius:17px}.summary strong{display:block;font-size:1.35rem}.summary span{color:var(--muted);font-size:.78rem}.timeline{display:grid;gap:12px}.card{border-radius:21px;overflow:hidden;transition:.25s ease;animation:in .35s ease both}.card:hover{transform:translateY(-2px)}.card-main{display:grid;grid-template-columns:66px 1fr auto;gap:14px;align-items:center;padding:17px}.time{font-weight:850;color:#a4547a;font-variant-numeric:tabular-nums;font-size:.87rem}.task h3{font-size:1rem;margin:0 0 5px}.task p{font-size:.84rem;color:var(--muted);margin:0}.badge{display:inline-block;font-size:.69rem;font-weight:800;border-radius:20px;padding:5px 9px;background:#f9e7ee;color:#b44f78}.badge.study{background:#e9e5fb;color:#7561ae}.badge.rest{background:#dff1f0;color:#427d7a}.badge.personal{background:#fff0d8;color:#ad7d33}.badge.church{background:#e9f0dc;color:#60814c}.actions{display:flex;gap:7px}.icon-btn{width:35px;height:35px;padding:0;color:#947481;background:#fff}.icon-btn:hover{color:var(--rose);background:#fff1f6}.focus{max-height:0;opacity:0;overflow:hidden;padding:0 18px;transition:.36s ease;background:linear-gradient(90deg,#fff8fb,#faf6ff)}.card.open .focus{max-height:260px;opacity:1;padding:18px}.focus-inner{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-top:1px dashed #eccbd8;padding-top:15px}.timer{font-size:2rem;font-weight:850;letter-spacing:.04em;color:var(--rose);font-variant-numeric:tabular-nums}.timer-controls{display:flex;gap:8px;flex-wrap:wrap}.verse{margin:0;color:#876b79;font-style:italic;font-size:.88rem;flex:1;min-width:180px}.empty{text-align:center;padding:45px;border-radius:22px;color:var(--muted)}dialog{border:0;border-radius:23px;padding:0;width:min(520px,calc(100% - 26px));max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);color:var(--ink)}dialog::backdrop{background:#5d304744}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:1.2rem;margin:0}.form{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow:auto;-webkit-overflow-scrolling:touch}.form label{font-size:.8rem;font-weight:750;color:#805e6c}.form label.wide{grid-column:1/-1}.form input,.form select{width:100%;min-height:44px;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:11px;outline-color:#e899b6;background:#fff;font-size:16px}.form-footer{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:5px}.notice{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,120px);z-index:9;background:#513945;color:#fff;padding:12px 17px;border-radius:14px;box-shadow:var(--shadow);transition:.3s}.notice.show{transform:translate(-50%,0)}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:600px){.shell{width:min(100% - 20px,960px);padding-top:calc(20px + env(safe-area-inset-top))}.hero{align-items:flex-start}.date-chip{display:none}.toolbar{align-items:stretch}.toolbar>.primary,.toolbar>.outline{flex:1;font-size:.82rem;padding-inline:10px}.summary{gap:8px}.summary>div{padding:11px}.card-main{grid-template-columns:54px 1fr auto;padding:14px;gap:8px}.actions{flex-direction:column}.form{grid-template-columns:1fr}.form label.wide{grid-column:auto}}
  </style>
</head>
<body>
  <main class="shell"><header class="hero"><div><p class="eyebrow">Mon espace organisé</p><h1>Mon doux planning ✿</h1><p id="greeting"></p></div><div class="date-chip" id="todayDate"></div></header>
  <section class="toolbar"><nav class="tabs" id="tabs" aria-label="Filtrer le planning"></nav><button class="outline" id="exportBtn">↗ Calendrier .ics</button><button class="outline" id="alertBtn">♬ Alertes</button><button class="primary" id="addBtn">＋ Ajouter</button></section>
  <section class="summary" id="summary"></section><section class="timeline" id="timeline"></section></main>
  <dialog id="eventDialog"><div class="modal-head"><h2 id="modalTitle">Nouveau créneau</h2><button class="icon-btn" id="closeDialog" aria-label="Fermer">×</button></div><form class="form" id="eventForm"><input type="hidden" id="eventId"><label>Jour<select id="day" required></select></label><label>Catégorie<select id="category"><option>Prière</option><option>Étude</option><option>Repos / Sommeil</option><option>Besoins personnels</option><option>Église / Cellule</option></select></label><label class="wide">Activité<input id="title" required maxlength="100" placeholder="Ex. Lecture personnelle"></label><label>Début<input id="start" type="time" required></label><label>Fin<input id="end" type="time" required></label><div class="form-footer"><button type="button" class="outline" id="cancelBtn">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form></dialog><div class="notice" id="notice"></div>
<script>
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DEFAULT=[
 ['Lundi - Jeudi','06:00','06:10','Prière','Prière pour ma journée'],['Lundi - Jeudi','06:10','07:30','Étude','Étude'],['Lundi - Jeudi','07:30','11:50','Besoins personnels','Préparation & École'],['Lundi - Jeudi','11:50','12:05','Prière','Méditer la Bible'],['Lundi - Jeudi','12:05','12:55','Étude','Étudier le cours suivant'],['Lundi - Jeudi','16:00','18:00','Besoins personnels','Besoins personnels'],['Lundi - Jeudi','18:00','21:00','Repos / Sommeil','Sommeil / Repos'],['Lundi - Jeudi','21:00','00:00','Étude','Résumés'],['Lundi - Jeudi','00:00','00:30','Prière',"Prière — d'autres sujets"],['Lundi - Jeudi','00:30','06:00','Repos / Sommeil','Sommeil'],
 ['Vendredi','10:00','10:15','Prière','Réveil & prière (15 min)'],['Vendredi','10:15','11:30','Besoins personnels','Besoins personnels'],['Vendredi','11:30','14:30','Étude','Résumés'],['Vendredi','14:30','16:00','Besoins personnels','Cuisiner et manger'],['Vendredi','16:00','19:00','Étude','Étude'],['Vendredi','19:00','21:00','Repos / Sommeil','Repos'],['Vendredi','21:00','22:00','Prière','Prière et méditation'],['Vendredi','22:00','00:00','Étude','Étude'],['Vendredi','00:00','07:30','Repos / Sommeil','Sommeil'],
 ['Samedi','07:30','07:40','Prière','Prière (10 min)'],['Samedi','07:40','08:40','Besoins personnels','Besoins personnels'],['Samedi','08:40','11:40','Étude','Étude'],['Samedi','11:40','12:00','Église / Cellule','Préparation pour la cellule'],['Samedi','16:00','18:00','Besoins personnels','Manger etc.'],['Samedi','18:00','18:30','Prière','Méditation'],['Samedi','18:30','21:00','Repos / Sommeil','Sommeil / Repos'],['Samedi','21:00','00:00','Étude','Étude'],['Samedi','00:00','00:30','Prière','Prière'],['Samedi','00:30','07:30','Repos / Sommeil','Sommeil'],
 ['Dimanche','07:30','07:40','Prière','Prière (10 min)'],['Dimanche','07:40','08:40','Besoins personnels','Besoins personnels'],['Dimanche','08:40','11:40','Étude','Étude'],['Dimanche','11:40','12:00','Église / Cellule',"Préparation pour l'église"],['Dimanche','18:00','20:00','Besoins personnels','Manger etc.'],['Dimanche','20:00','22:00','Repos / Sommeil','Repos'],['Dimanche','22:00','23:00','Étude','Étude'],['Dimanche','23:00','00:00','Prière','Méditation et prière'],['Dimanche','00:00','07:30','Repos / Sommeil','Sommeil']
].flatMap(([day,start,end,category,title],i)=>(day==='Lundi - Jeudi'?DAYS.slice(0,4):[day]).map((actualDay,j)=>({id:`seed-${i}-${j}`,day:actualDay,start,end,category,title})));
let events=JSON.parse(localStorage.getItem('rama-planning')||'null')||DEFAULT, filter='Aujourd’hui', timers={};
// Migration transparente des anciennes données : les créneaux Lundi–Jeudi deviennent 4 créneaux distincts.
if(events.some(e=>e.day==='Lundi - Jeudi')){events=events.flatMap(e=>e.day==='Lundi - Jeudi'?DAYS.slice(0,4).map((day,i)=>({...e,id:`${e.id}-jour-${i}`,day})):[e]);localStorage.setItem('rama-planning',JSON.stringify(events));}
// Mise à jour du libellé du réveil du vendredi, sans toucher aux créneaux personnalisés.
if(events.some(e=>e.day==='Vendredi'&&e.start==='10:00'&&e.end==='10:15'&&e.title==='Prière (15 min)')){events=events.map(e=>e.day==='Vendredi'&&e.start==='10:00'&&e.end==='10:15'&&e.title==='Prière (15 min)'?{...e,title:'Réveil & prière (15 min)'}:e);localStorage.setItem('rama-planning',JSON.stringify(events));}
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function activeDay(){return ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'][new Date().getDay()]}function isPrayer(e){return /Prière|Méditation/i.test(e.category+' '+e.title)}function mins(e){let [a,b]=e.start.split(':').map(Number),[c,d]=e.end.split(':').map(Number);let m=c*60+d-a*60-b;if(m<=0)m+=1440;return m}function save(){localStorage.setItem('rama-planning',JSON.stringify(events))}function kind(c){return c.includes('Étude')?'study':c.includes('Repos')?'rest':c.includes('personnels')?'personal':c.includes('Église')?'church':''}
function render(){let day=filter==='Aujourd’hui'?activeDay():filter, list=events.filter(e=>e.day===day).sort((a,b)=>a.start.localeCompare(b.start));$('#tabs').innerHTML=['Aujourd’hui',...DAYS].map(x=>`<button class="tab ${x===filter?'active':''}" data-filter="${x}">${x}</button>`).join('');$('#summary').innerHTML=`<div class="glass"><strong>${list.length}</strong><span>créneaux prévus</span></div><div class="glass"><strong>${Math.round(list.reduce((n,e)=>n+mins(e),0)/60)} h</strong><span>temps organisé</span></div><div class="glass"><strong>${list.filter(isPrayer).length}</strong><span>moments de foi</span></div>`;$('#timeline').innerHTML=list.length?list.map((e,i)=>card(e,i)).join(''):'<div class="empty glass">Une page toute douce et libre ✿<br>Ajoute ton premier créneau.</div>';document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(events.find(e=>e.id===b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer ce créneau ?')){events=events.filter(e=>e.id!==b.dataset.del);save();render()}});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>toggleFocus(b.dataset.focus));}
function card(e,i){let focus=isPrayer(e);return `<article class="card" style="animation-delay:${i*.025}s" id="card-${e.id}"><div class="card-main"><time class="time">${e.start}<br>→ ${e.end}</time><div class="task" ${focus?`data-focus="${e.id}" role="button" tabindex="0" title="Ouvrir le minuteur"`:''}><h3>${esc(e.title)}</h3><span class="badge ${kind(e.category)}">${esc(e.category)}</span></div><div class="actions">${focus?`<button class="icon-btn" data-focus="${e.id}" title="Ouvrir le minuteur">◷</button>`:''}<button class="icon-btn" data-edit="${e.id}" title="Modifier">✎</button><button class="icon-btn" data-del="${e.id}" title="Supprimer">×</button></div></div>${focus?`<div class="focus"><div class="focus-inner"><strong class="timer" id="timer-${e.id}">${format(mins(e)*60)}</strong><div class="timer-controls"><button class="primary" data-start="${e.id}">Démarrer</button><button class="outline" data-pause="${e.id}">Pause</button><button class="outline" data-reset="${e.id}">Réinitialiser</button></div><p class="verse">« Que la paix de Dieu garde ton cœur aujourd’hui. »</p></div></div>`:''}</article>`}
function format(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function toggleFocus(id){let card=$('#card-'+id);card.classList.toggle('open');let e=events.find(x=>x.id===id);if(!timers[id])timers[id]={left:mins(e)*60,interval:null};bindTimer(id,e)}function bindTimer(id,e){let t=timers[id],out=$('#timer-'+id);out.textContent=format(t.left);$(`[data-start="${id}"]`).onclick=()=>{if(t.interval)return;t.interval=setInterval(()=>{if(--t.left<=0){clearInterval(t.interval);t.interval=null;t.left=0;chime();notify('Temps de prière terminé ✿')}out.textContent=format(t.left)},1000)};$(`[data-pause="${id}"]`).onclick=()=>{clearInterval(t.interval);t.interval=null};$(`[data-reset="${id}"]`).onclick=()=>{clearInterval(t.interval);t.interval=null;t.left=mins(e)*60;out.textContent=format(t.left)}}
function chime(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=659;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+2);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+2)}catch{}}function notify(msg){$('#notice').textContent=msg;$('#notice').classList.add('show');setTimeout(()=>$('#notice').classList.remove('show'),4200);if('Notification'in window&&Notification.permission==='granted')new Notification('Mon doux planning',{body:msg,icon:'icon.svg'})}
function openForm(e){$('#eventForm').reset();$('#modalTitle').textContent=e?'Modifier le créneau':'Nouveau créneau';$('#eventId').value=e?.id||'';$('#day').innerHTML=DAYS.map(d=>`<option ${e?.day===d?'selected':''}>${d}</option>`).join('');if(e){$('#category').value=e.category;$('#title').value=e.title;$('#start').value=e.start;$('#end').value=e.end}$('#eventDialog').showModal()}$('#addBtn').onclick=()=>openForm();$('#closeDialog').onclick=$('#cancelBtn').onclick=()=>$('#eventDialog').close();$('#eventForm').onsubmit=e=>{e.preventDefault();let data={id:$('#eventId').value||crypto.randomUUID(),day:$('#day').value,category:$('#category').value,title:$('#title').value.trim(),start:$('#start').value,end:$('#end').value};if(data.start===data.end)return notify('Choisis une heure de fin différente.');let i=events.findIndex(x=>x.id===data.id);i<0?events.push(data):events[i]=data;save();$('#eventDialog').close();render();notify('Planning enregistré ✿')};
function icsEscape(s){return s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}function exportICS(){let map={Lundi:['MO'],Mardi:['TU'],Mercredi:['WE'],Jeudi:['TH'],Vendredi:['FR'],Samedi:['SA'],Dimanche:['SU']},now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');let monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);let date=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;let dayOffset={MO:0,TU:1,WE:2,TH:3,FR:4,SA:5,SU:6};let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mon Doux Planning//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Mon doux planning'];events.forEach(e=>{map[e.day].forEach(by=>{let d=new Date(monday);d.setDate(monday.getDate()+dayOffset[by]);let endD=new Date(d);if(e.end<e.start||e.end==='00:00')endD.setDate(d.getDate()+1);let start=e.start.replace(':','')+'00',end=e.end.replace(':','')+'00';lines.push('BEGIN:VEVENT',`UID:rama-${e.id}-${by}@planning.local`,`DTSTAMP:${stamp}`,`DTSTART:${date(d)}T${start}`,`DTEND:${date(endD)}T${end}`,`RRULE:FREQ=WEEKLY;BYDAY=${by}`,`SUMMARY:${icsEscape(e.title)}`,`DESCRIPTION:${icsEscape(e.category+' — Mon doux planning')}`,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY',`DESCRIPTION:${icsEscape(e.title)}`,'END:VALARM','END:VEVENT')})});lines.push('END:VCALENDAR');let blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mon-doux-planning.ics';a.click();URL.revokeObjectURL(a.href);notify('Fichier calendrier téléchargé ✿')}$('#exportBtn').onclick=exportICS;
function checkCurrent(){let day=activeDay(),n=new Date(),time=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,e=events.find(x=>x.day===day&&x.start===time);if(e&&!sessionStorage.getItem('notice-'+day+time)){sessionStorage.setItem('notice-'+day+time,'1');notify(`C’est l’heure : ${e.title}`)}}
$('#alertBtn').onclick=async()=>{if(!('Notification'in window))return notify('Les alertes ne sont pas disponibles dans ce navigateur.');let permission=await Notification.requestPermission();notify(permission==='granted'?'Alertes activées ✿':'Autorise les alertes dans Réglages Safari pour les recevoir.')};$('#todayDate').textContent=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());$('#greeting').textContent='Ton rythme, ta paix, ton équilibre.';if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');setInterval(checkCurrent,20000);checkCurrent();render();
</script></body></html>
